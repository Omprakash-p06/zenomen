<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service name com.zenomen.Hardware1 -->
  <policy user="root">
    <allow own="com.zenomen.Hardware1"/>
    <allow send_destination="com.zenomen.Hardware1"/>
  </policy>

  <!-- Any local user can communicate with the service.
       Mutating actions are authorized by PolicyKit inside the service. -->
  <policy context="default">
    <allow send_destination="com.zenomen.Hardware1"/>
    <allow receive_sender="com.zenomen.Hardware1"/>
  </policy>
</busconfig>
