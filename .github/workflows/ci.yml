name: CI

# Quality gates for Linux (Ubuntu 22.04) and Windows 10/11.
# Formatting, zero-warning clippy, full headless test suites, and dependency audit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-quality:
    name: Linux Quality Gates (Ubuntu 22.04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, clippy, rustfmt)
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy --component rustfmt
          rustup default stable

      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (headless xvfb)
        run: xvfb-run --auto-servernum cargo test --all

      - name: Security audit
        run: cargo audit

  windows-quality:
    name: Windows Quality Gates (Windows 10/11 x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, clippy, rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy Windows (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Windows
        run: cargo test --all
