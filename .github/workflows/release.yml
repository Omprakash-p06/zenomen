name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zenomen") | .version')
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match Cargo.toml version $ver" >&2
            exit 1
          fi

      - name: Install Rust toolchain (stable, clippy, rustfmt)
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy --component rustfmt
          rustup default stable

      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            xvfb \
            dpkg-dev \
            file \
            libfuse2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (zero warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test (headless)
        run: xvfb-run --auto-servernum cargo test --locked --all

      - name: Install cargo-audit
        uses: taiki-e/install-action@51c68eec2f87cf80a8276f57ee92a2a7a8d569cc # v2.49.18
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit

      - name: Install cargo-packager
        uses: taiki-e/install-action@51c68eec2f87cf80a8276f57ee92a2a7a8d569cc # v2.49.18
        with:
          tool: cargo-packager

      - name: Build release packages (DEB & AppImage)
        run: cargo packager --release --formats deb,appimage

      - name: Verify artifact filenames match version
        working-directory: dist
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 --manifest-path ../Cargo.toml \
            | jq -r '.packages[] | select(.name == "zenomen") | .version')
          ls *"$ver"*.deb
          ls *"$ver"*.AppImage

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c95c14d83b5ac94360644342dd3080ff559f6d48 # v2.2.1
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
