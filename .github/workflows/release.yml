name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    name: Build Linux Release (DEB & AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zenomen") | .version')
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match Cargo.toml version $ver" >&2
            exit 1
          fi

      - name: Install Rust toolchain (stable, clippy, rustfmt)
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy --component rustfmt
          rustup default stable

      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            xvfb \
            dpkg-dev \
            file \
            libfuse2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (zero warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test (headless)
        run: xvfb-run --auto-servernum cargo test --locked --all

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build release packages (DEB & AppImage)
        run: cargo packager --release --formats deb,appimage

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.deb *.AppImage > SHA256SUMS-linux
          cat SHA256SUMS-linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS-linux

  release-windows:
    name: Build Windows Release (MSI & Binaries)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix

      - name: Build release binaries
        run: |
          cargo build --release --locked --bins

      - name: Package WiX MSI
        run: |
          mkdir dist
          wix build packaging/windows/ZenOmen.wxs -o dist/ZenOmen-x64.msi

      - name: Package Zip archive
        run: |
          Compress-Archive -Path target/release/zenomen.exe, target/release/zenomen-hw.exe, LICENSE, README.md -DestinationPath dist/zenomen-windows-x64.zip

      - name: Generate Windows SHA-256 Checksums
        working-directory: dist
        run: |
          Get-FileHash -Algorithm SHA256 ZenOmen-x64.msi, zenomen-windows-x64.zip | Out-File -Encoding utf8 SHA256SUMS-windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/ZenOmen-x64.msi
            dist/zenomen-windows-x64.zip
            dist/SHA256SUMS-windows.txt

  publish-release:
    name: Publish Unified Dual-OS Release
    needs: [release-linux, release-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: artifacts

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: artifacts

      - name: Consolidate Checksums
        working-directory: artifacts
        run: |
          cat SHA256SUMS-linux > SHA256SUMS
          cat SHA256SUMS-windows.txt >> SHA256SUMS
          rm SHA256SUMS-linux SHA256SUMS-windows.txt
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
