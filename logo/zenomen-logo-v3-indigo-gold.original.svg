    <linearGradient id="flameP" x1="0" y1="436" x2="0" y2="586" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#FFE08A"/><stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
    <linearGradient id="lid" x1="298" y1="0" x2="726" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C873"/><stop offset="0.5" stop-color="#FFF4D2"/><stop offset="1" stop-color="#E6C873"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="eye" d="M298,512 Q512,360 726,512 Q512,664 298,512 Z"/>
    <clipPath id="eyeClip"><use href="#eye"/></clipPath>
    <path id="flame" d="M520,436 C526,472 566,494 566,536 C566,566 543,586 512,586 C481,586 458,566 458,538 C458,514 474,500 486,478 C488,494 497,502 507,505 C503,481 509,458 520,436 Z"/>
  </defs>

