  <title id="t">ZenOmen logo</title>
  <desc id="d">An open enso circle around a calm eye whose pupil is a single flame, inside a rounded square with one thick border.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4D98C"/><stop offset="1" stop-color="#BF8F32"/>
    </linearGradient>
    <radialGradient id="bg" cx="512" cy="512" r="600" gradientUnits="userSpaceOnUse">
