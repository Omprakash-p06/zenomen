[package]
name = "zenomen"
version = "0.1.0"
edition = "2024"
authors = ["Omprakash <p06>"]
license = "GPL-3.0-only"
description = "Lightweight hardware control center for HP OMEN and Victus laptops"
repository = "https://github.com/Omprakash-p06/zenomen"

[features]
# The GUI is built by default; `--no-default-features` exists so the privileged
# daemon can be built without compiling or linking Slint at all.
default = ["ui"]
ui = ["dep:slint"]

[dependencies]
# Slint GUI toolkit — pinned to 1.17. Deliberately excludes the Qt and Skia
# backends so the desktop UI process stays inside the <=40 MB RSS budget.
slint = { version = "1.17", default-features = false, optional = true, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
] }

# Core utilities
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
zbus = { version = "5", features = ["blocking"] }
tracing-appender = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.17"

[[bin]]
name = "zenomen"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "zenomen-hw"
path = "src/bin/zenomen-hw.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_IO",
    "Win32_System_Wmi",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
] }

[profile.dev]
# Disable full DWARF debuginfo and incremental caches to prevent target/ from ballooning to 20+ GB
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
# Size and memory oriented: this profile exists to uphold the <=40 MB peak RSS
# budget, not to win microbenchmarks.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.packager]
product-name = "ZenOmen"
identifier = "com.zenomen.ZenOmen"
description = "Lightweight hardware control center for HP OMEN and Victus laptops"
category = "Utility"
license-file = "LICENSE"
icons = [
  "data/icons/hicolor/*/apps/zenomen.png",
  "data/icons/hicolor/scalable/apps/zenomen.svg",
]
out-dir = "dist"
binaries-dir = "target/release"
binaries = [
  { path = "zenomen", main = true },
  { path = "zenomen-hw", main = false },
]
before-packaging-command = "cargo build --release --bins --locked"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libfontconfig1", "libgl1", "libdbus-1-3"]

[package.metadata.packager.deb.files]
"data/applications/zenomen.desktop" = "/usr/share/applications/zenomen.desktop"
"data/systemd/zenomen-hw.service" = "/usr/lib/systemd/system/zenomen-hw.service"
"data/dbus/com.zenomen.Hardware1.service" = "/usr/share/dbus-1/system-services/com.zenomen.Hardware1.service"
"data/dbus/com.zenomen.Hardware1.conf" = "/usr/share/dbus-1/system.d/com.zenomen.Hardware1.conf"
"data/polkit/com.zenomen.hardware.policy" = "/usr/share/polkit-1/actions/com.zenomen.hardware.policy"
"README.md" = "/usr/share/doc/zenomen/README.md"
"LICENSE" = "/usr/share/doc/zenomen/LICENSE"
"NOTICE" = "/usr/share/doc/zenomen/NOTICE"
